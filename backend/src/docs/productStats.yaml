paths:
  /product-stats/top:
    get:
      summary: Obtener productos más vendidos
      description: Devuelve los productos más vendidos de manera global.
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            default: 5
          description: Cantidad máxima de productos a devolver
      responses:
        "200":
          description: Lista de productos más vendidos
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    productId:
                      type: string
                    _sum:
                      type: object
                      properties:
                        quantity:
                          type: integer
        "500":
          description: Error al obtener productos más vendidos

  /product-stats/worst:
    get:
      summary: Obtener productos menos vendidos
      description: Devuelve los productos menos vendidos de manera global.
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            default: 5
      responses:
        "200":
          description: Lista de productos menos vendidos
        "500":
          description: Error al obtener productos menos vendidos

  /product-stats/top-range:
    get:
      summary: Obtener productos más vendidos en un rango de fechas
      parameters:
        - in: query
          name: start
          required: true
          schema:
            type: string
            format: date
          description: Fecha de inicio (YYYY-MM-DD)
        - in: query
          name: end
          required: true
          schema:
            type: string
            format: date
          description: Fecha de fin (YYYY-MM-DD)
        - in: query
          name: limit
          schema:
            type: integer
            default: 5
      responses:
        "200":
          description: Lista de productos más vendidos en rango
        "400":
          description: Faltan parámetros de fecha
        "500":
          description: Error interno

  /product-stats/best-month:
    get:
      summary: Obtener el producto más vendido de un mes específico
      parameters:
        - in: query
          name: year
          required: true
          schema:
            type: integer
          description: Año (YYYY)
        - in: query
          name: month
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 12
          description: Mes (1-12)
      responses:
        "200":
          description: Producto más vendido del mes
        "400":
          description: Faltan parámetros
        "500":
          description: Error interno

  /product-stats/worst-month:
    get:
      summary: Obtener el producto menos vendido de un mes específico
      parameters:
        - in: query
          name: year
          required: true
          schema:
            type: integer
        - in: query
          name: month
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 12
      responses:
        "200":
          description: Producto menos vendido del mes
        "400":
          description: Faltan parámetros
        "500":
          description: Error interno
