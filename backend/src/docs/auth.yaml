tags:
  - name: Auth
    description: Endpoints de autenticación

paths:
  /auth/register:
    post:
      summary: Registrar un nuevo usuario
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        201:
          description: Usuario creado exitosamente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        400:
          description: Error en los datos enviados

  /auth/login:
    post:
      summary: Iniciar sesión
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        200:
          description: Login exitoso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        401:
          description: Credenciales inválidas

  /auth/logout:
    post:
      summary: Cerrar sesión
      tags: [Auth]
      responses:
        200:
          description: Logout exitoso
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Logout exitoso

  /auth/me:
    get:
      summary: Obtener datos del usuario autenticado
      tags: [Auth]
      security:
        - bearerAuth: []
      responses:
        200:
          description: Usuario autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        401:
          description: No autorizado

  /auth/{id}:
    delete:
      summary: Eliminar un usuario por ID
      tags: [Auth]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        200:
          description: Usuario eliminado exitosamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Usuario eliminado
        404:
          description: Usuario no encontrado

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    RegisterInput:
      type: object
      required:
        - email
        - password
        - name
        - role
      properties:
        email:
          type: string
          example: admin@comarpos.com.ar
        password:
          type: string
          example: 123456
        name:
          type: string
          example: Admin Von König
        role:
          type: string
          enum: [ADMIN, EMPLEADO]
          example: ADMIN

    LoginInput:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          example: admin@comarpos.com.ar
        password:
          type: string
          example: 123456

    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        name:
          type: string
        role:
          type: string
          enum: [ADMIN, EMPLEADO]
        createdAt:
          type: string
          format: date-time

    LoginResponse:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/User"
