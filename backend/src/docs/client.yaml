tags:
  - name: Clients
    description: Endpoints para gestión de clientes y datos base de cuenta corriente

paths:
  /clients:
    get:
      summary: Listar clientes
      tags: [Clients]
      security:
        - bearerAuth: []
      responses:
        200:
          description: Lista de clientes
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  clients:
                    type: array
                    items:
                      $ref: "#/components/schemas/Client"

    post:
      summary: Crear cliente
      tags: [Clients]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientInput"
      responses:
        201:
          description: Cliente creado

  /clients/{id}:
    get:
      summary: Obtener cliente por ID
      tags: [Clients]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        200:
          description: Cliente encontrado
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  client:
                    $ref: "#/components/schemas/ClientDetail"

    put:
      summary: Actualizar cliente
      tags: [Clients]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientUpdateInput"
      responses:
        200:
          description: Cliente actualizado

    delete:
      summary: Eliminar cliente
      description: No permite eliminar clientes con deuda, ventas o movimientos de cuenta corriente.
      tags: [Clients]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        200:
          description: Cliente eliminado

components:
  schemas:
    ClientInput:
      type: object
      required:
        - nombre
        - apellido
        - dni
        - category
      properties:
        nombre:
          type: string
        apellido:
          type: string
        dni:
          type: string
        telefono:
          type: string
          nullable: true
        gmail:
          type: string
          nullable: true
        category:
          type: string
          enum: [Mayorista, Cliente]
        creditLimit:
          type: number
          nullable: true
        isAccountEnabled:
          type: boolean
          default: true

    ClientUpdateInput:
      type: object
      properties:
        nombre:
          type: string
        apellido:
          type: string
        dni:
          type: string
        telefono:
          type: string
          nullable: true
        gmail:
          type: string
          nullable: true
        category:
          type: string
          enum: [Mayorista, Cliente]
        creditLimit:
          type: number
          nullable: true
        isAccountEnabled:
          type: boolean

    Client:
      type: object
      properties:
        id:
          type: string
          format: uuid
        nombre:
          type: string
        apellido:
          type: string
        dni:
          type: string
        telefono:
          type: string
          nullable: true
        gmail:
          type: string
          nullable: true
        category:
          type: string
          enum: [Mayorista, Cliente]
        currentBalance:
          type: number
        creditLimit:
          type: number
          nullable: true
        isAccountEnabled:
          type: boolean
        createdAt:
          type: string
          format: date-time

    ClientDetail:
      allOf:
        - $ref: "#/components/schemas/Client"
        - type: object
          properties:
            sales:
              type: array
              items:
                type: object
            accountMovements:
              type: array
              items:
                type: object
