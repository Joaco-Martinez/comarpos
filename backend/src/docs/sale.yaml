tags:
  - name: Sales
    description: Endpoints para registrar, consultar y administrar ventas

paths:
  /sales:
    get:
      summary: Listar todas las ventas
      tags: [Sales]
      security:
        - bearerAuth: []
      responses:
        200:
          description: Lista de ventas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Sale"

    post:
      summary: Crear una nueva venta
      description: >
        Crea una venta con productos UNIT, productos KG y productos COMPUESTOS.
        Si el producto es COMPUESTO, el sistema vende el producto padre con su precio propio,
        pero descuenta stock de sus componentes.
      tags: [Sales]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaleInput"
            examples:
              ventaSimple:
                summary: Venta simple
                value:
                  clientId: "uuid-cliente"
                  paymentMethod: "EFECTIVO"
                  receiptType: "TICKET"
                  status: "PENDING"
                  items:
                    - productId: "uuid-coca"
                      quantity: 1
              ventaKg:
                summary: Venta por KG
                value:
                  clientId: "uuid-cliente"
                  paymentMethod: "EFECTIVO"
                  receiptType: "TICKET"
                  status: "PENDING"
                  items:
                    - productId: "uuid-chocolate-kg"
                      quantityKg: 0.5
              ventaPromo:
                summary: Venta de promo compuesta
                value:
                  clientId: "uuid-cliente"
                  paymentMethod: "EFECTIVO"
                  receiptType: "TICKET"
                  status: "PENDING"
                  items:
                    - productId: "uuid-promo-fernet-coca"
                      quantity: 1
                    - productId: "uuid-coca"
                      quantity: 1
              ventaPagosMultiples:
                summary: Venta con pagos múltiples
                value:
                  clientId: "uuid-cliente"
                  paymentMethod: "EFECTIVO"
                  receiptType: "TICKET"
                  status: "PENDING"
                  items:
                    - productId: "uuid-producto"
                      quantity: 1
                  payments:
                    - method: "EFECTIVO"
                      amount: 5000
                    - method: "TRANSFERENCIA"
                      amount: 7000
                      reference: "Comprobante 123"
      responses:
        201:
          description: Venta creada correctamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  sale:
                    $ref: "#/components/schemas/Sale"
                  invoice:
                    $ref: "#/components/schemas/Invoice"
        400:
          description: Error de validación o stock insuficiente

  /sales/pending:
    get:
      summary: Listar ventas pendientes
      tags: [Sales]
      security:
        - bearerAuth: []
      responses:
        200:
          description: Ventas con estado PENDING
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Sale"

  /sales/pending/bulk-update:
    post:
      summary: Actualizar masivamente ventas pendientes
      tags: [Sales]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - action
              properties:
                action:
                  type: string
                  enum: [COMPLETE, CANCEL]
                  example: COMPLETE
      responses:
        200:
          description: Ventas pendientes actualizadas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Sale"

  /sales/{id}:
    get:
      summary: Obtener una venta por ID
      tags: [Sales]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        200:
          description: Venta encontrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sale"
        404:
          description: Venta no encontrada

  /sales/{id}/status:
    patch:
      summary: Actualizar estado de una venta
      description: >
        Si la venta pasa a CANCELLED, el sistema reintegra stock.
        Si la venta tenía productos COMPUESTOS, reintegra únicamente los componentes.
      tags: [Sales]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  type: string
                  enum: [PENDING, COMPLETED, CANCELLED]
                  example: COMPLETED
      responses:
        200:
          description: Venta actualizada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sale"

  /sales/{id}/payment:
    patch:
      summary: Actualizar método de pago principal de una venta
      description: Endpoint legacy. Solo cambia el campo paymentMethod principal.
      tags: [Sales]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - paymentMethod
              properties:
                paymentMethod:
                  $ref: "#/components/schemas/PaymentMethod"
      responses:
        200:
          description: Método de pago actualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sale"

  /sales/{id}/payments:
    patch:
      summary: Reemplazar pagos múltiples de una venta
      description: >
        Reemplaza todos los pagos asociados a la venta.
        La suma de los pagos debe coincidir con el total de la venta.
      tags: [Sales]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - payments
              properties:
                setAsPrimary:
                  type: boolean
                  example: true
                payments:
                  type: array
                  items:
                    $ref: "#/components/schemas/SalePaymentInput"
      responses:
        200:
          description: Pagos actualizados
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sale"

  /sales/{id}/nota-pedido:
    post:
      summary: Generar nota de pedido PDF
      tags: [Sales]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        200:
          description: Nota de pedido generada
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  message:
                    type: string
                  result:
                    type: object

components:
  schemas:
    PaymentMethod:
      type: string
      enum:
        - EFECTIVO
        - TARJETA
        - TRANSFERENCIA
        - QR
        - DEBITO
        - CREDITO
        - QR_NACION
        - QR_MERCADOPAGO
        - TARJETA_DEBITO
        - TARJETA_CREDITO
        - CUENTA_CORRIENTE
      example: EFECTIVO

    ReceiptType:
      type: string
      enum:
        - TICKET
        - FACTURA
      example: TICKET

    SaleStatus:
      type: string
      enum:
        - PENDING
        - COMPLETED
        - CANCELLED
      example: PENDING

    DiscountType:
      type: string
      enum:
        - PERCENTAGE
        - FIXED
      example: PERCENTAGE

    SaleInput:
      type: object
      required:
        - paymentMethod
        - receiptType
        - items
      properties:
        userId:
          type: string
          format: uuid
          nullable: true
        clientId:
          type: string
          format: uuid
          nullable: true
        gmailSend:
          type: string
          nullable: true
          example: cliente@email.com
        discountType:
          $ref: "#/components/schemas/DiscountType"
        discountValue:
          type: number
          nullable: true
          example: 10
        paymentMethod:
          $ref: "#/components/schemas/PaymentMethod"
        payments:
          type: array
          nullable: true
          description: >
            Pagos múltiples. Si se envía, la suma debe ser igual al total de la venta.
          items:
            $ref: "#/components/schemas/SalePaymentInput"
        receiptType:
          $ref: "#/components/schemas/ReceiptType"
        status:
          $ref: "#/components/schemas/SaleStatus"
        items:
          type: array
          items:
            $ref: "#/components/schemas/SaleItemInput"

    SaleItemInput:
      type: object
      required:
        - productId
      properties:
        productId:
          type: string
          format: uuid
          example: uuid-producto
        quantity:
          type: number
          nullable: true
          description: Cantidad para productos UNIT
          example: 1
        quantityKg:
          type: number
          nullable: true
          description: Cantidad para productos vendidos por KG
          example: 0.5
        price:
          type: number
          nullable: true
          description: Campo legacy. El backend calcula el precio real según cliente.
          example: 6000
        boxContents:
          type: array
          nullable: true
          description: >
            Campo legacy/manual. Para productos COMPUESTOS, el backend resuelve componentes automáticamente desde ProductComponent.
          items:
            $ref: "#/components/schemas/BoxContentInput"

    BoxContentInput:
      type: object
      required:
        - productId
      properties:
        productId:
          type: string
          format: uuid
          example: uuid-componente
        quantity:
          type: number
          nullable: true
          example: 1
        quantityKg:
          type: number
          nullable: true
          example: 0.25

    SalePaymentInput:
      type: object
      required:
        - method
        - amount
      properties:
        method:
          $ref: "#/components/schemas/PaymentMethod"
        amount:
          type: number
          example: 12000
        reference:
          type: string
          nullable: true
          example: Comprobante 123
        notes:
          type: string
          nullable: true
          example: Pago parcial en transferencia

    Sale:
      type: object
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
          nullable: true
        clientId:
          type: string
          format: uuid
          nullable: true
        gmailSend:
          type: string
          nullable: true
        subtotal:
          type: number
          example: 18000
        total:
          type: number
          example: 18000
        grossProfit:
          type: number
          description: Utilidad bruta total de la venta, con descuento proporcional aplicado a los items.
          example: 4200
        discountType:
          $ref: "#/components/schemas/DiscountType"
        discountValue:
          type: number
          nullable: true
        paymentMethod:
          $ref: "#/components/schemas/PaymentMethod"
        receiptType:
          $ref: "#/components/schemas/ReceiptType"
        status:
          $ref: "#/components/schemas/SaleStatus"
        isInvoiced:
          type: boolean
        isNoteCredit:
          type: boolean
        invoiceStatus:
          type: string
          nullable: true
        afipLastError:
          type: string
          nullable: true
        pdfUrl:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        payments:
          type: array
          items:
            $ref: "#/components/schemas/SalePayment"
        client:
          nullable: true
          $ref: "#/components/schemas/Client"
        user:
          nullable: true
          $ref: "#/components/schemas/User"
        items:
          type: array
          items:
            $ref: "#/components/schemas/SaleItem"

    SaleItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        saleId:
          type: string
          format: uuid
        productId:
          type: string
          format: uuid
        quantity:
          type: number
          description: Cantidad UNIT
        quantityKg:
          type: number
          nullable: true
          description: Cantidad KG
        price:
          type: number
        subtotal:
          type: number
        purchasePriceSnapshot:
          type: number
          description: Costo histórico unitario/KG al momento de la venta. En compuestos, costo de componentes por una unidad del padre.
        profit:
          type: number
          description: Utilidad bruta del item con descuento proporcional aplicado.
        productNameSnapshot:
          type: string
          nullable: true
        productSkuSnapshot:
          type: string
          nullable: true
        product:
          $ref: "#/components/schemas/Product"
        boxContents:
          type: array
          items:
            $ref: "#/components/schemas/BoxContent"

    BoxContent:
      type: object
      properties:
        id:
          type: string
          format: uuid
        saleItemId:
          type: string
          format: uuid
        productId:
          type: string
          format: uuid
        quantity:
          type: number
          nullable: true
        quantityKg:
          type: number
          nullable: true
        product:
          $ref: "#/components/schemas/Product"

    SalePayment:
      type: object
      properties:
        id:
          type: string
          format: uuid
        saleId:
          type: string
          format: uuid
        method:
          $ref: "#/components/schemas/PaymentMethod"
        amount:
          type: number
        reference:
          type: string
          nullable: true
        notes:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time

    Invoice:
      type: object
      properties:
        id:
          type: string
          format: uuid
        saleId:
          type: string
          format: uuid
        pdfUrl:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time

    Client:
      type: object
      properties:
        id:
          type: string
          format: uuid
        nombre:
          type: string
        apellido:
          type: string
        dni:
          type: string
        telefono:
          type: string
          nullable: true
        gmail:
          type: string
          nullable: true
        category:
          type: string
          enum: [Mayorista, Cliente]
        currentBalance:
          type: number
          nullable: true

    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
        role:
          type: string

    Product:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        sku:
          type: string
          nullable: true
        type:
          type: string
          enum: [SIMPLE, COMPUESTO]
        saleUnit:
          type: string
          enum: [UNIT, KG]
        price:
          type: number
        pricePerKg:
          type: number
          nullable: true